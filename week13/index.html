<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Webpage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background">
    <div class="bubble bubble1"></div>
    <div class="bubble bubble2"></div>
    <div class="bubble bubble3"></div>
  </div>

  <header>
    <h1 class="fade-in">My Animation Webpage</h1>
    <p class="fade-in delay">This page shows four different animations using HTML, CSS, and JavaScript.</p>
  </header>

  <main>
    <section class="card-container">
      <div class="card">Hover over me</div>
      <div class="card">I animate too</div>
      <div class="card">CSS is fun</div>
    </section>

    <section class="button-section">
      <button id="animateButton">Click Me</button>
      <div id="box"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
